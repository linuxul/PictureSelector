import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.luck.picture.lib'

    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "pictureselector"
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0' // 또는 그 이상 최신 버전

    // AppCompat (Material Components for Android를 사용하는 것이 더 권장됩니다)
    implementation 'androidx.appcompat:appcompat:1.6.1' // 또는 그 이상 최신 버전

    // Activity & Fragment KTX
    implementation "androidx.activity:activity-ktx:1.8.0" // 또는 그 이상 최신 버전
    implementation "androidx.fragment:fragment-ktx:1.6.2" // 또는 그 이상 최신 버전

    // RecyclerView & ViewPager2
    implementation "androidx.recyclerview:recyclerview:1.3.2" // 또는 그 이상 최신 버전
    implementation "androidx.viewpager2:viewpager2:1.0.0" // ViewPager2는 1.0.0이 오랫동안 안정 버전입니다. 특별한 변경이 없다면 유지 가능.

    // ConstraintLayout
    implementation "androidx.constraintlayout:constraintlayout:2.1.4" // ConstraintLayout은 2.1.4가 오랫동안 안정 버전입니다. 특별한 변경이 없다면 유지 가능.

    // Lifecycle (LiveData & ViewModel KTX)
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0' // 또는 그 이상 최신 버전
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0' // 또는 그 이상 최신 버전

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3" // 또는 그 이상 최신 버전
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3" // 또는 그 이상 최신 버전

    // (추가 권장) Material Components for Android - UI 디자인에 권장됩니다.
    // implementation 'com.google.android.material:material:1.11.0' // 또는 그 이상 최신 버전
}
